[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claude-router"
version = "0.1.0"
description = "Use Z.ai GLM and OpenRouter models inside Claude Code next to your native Claude login"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andres Perez" }]
keywords = ["claude-code", "openrouter", "zai", "coding-agent", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AndresPrez/claude-router"
Repository = "https://github.com/AndresPrez/claude-router"
Issues = "https://github.com/AndresPrez/claude-router/issues"

[project.scripts]
claude-router = "claude_router.cli:main"
clr = "claude_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
